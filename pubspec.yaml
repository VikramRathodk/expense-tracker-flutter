name: expense_tracker
description: "Production-grade personal finance app — multi-currency expense tracking, budgets, recurring expenses, analytics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.3.0

  # HTTP client
  dio: ^5.7.0

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Code generation (models)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Secure storage (tokens, user PII)
  flutter_secure_storage: ^10.3.1

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Networking utilities
  connectivity_plus: ^7.1.1

  # UI — charts
  fl_chart: ^1.2.0

  # UI — pagination
  infinite_scroll_pagination: ^5.1.1

  # UI — images
  cached_network_image: ^3.4.1

  # UI — shimmer loading skeleton
  shimmer: ^3.0.0

  # UI — fonts & animations
  google_fonts: ^8.1.0
  animations: ^2.0.11

  # File operations
  image_picker: ^1.1.2
  file_picker: ^12.0.0-beta.5

  # Receipt viewer (full-screen image)
  photo_view: ^0.15.0

  # File open (PDF / CSV export)
  open_file: ^4.0.0

  # Internationalisation & formatting
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation runners
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # assets and fonts added when first needed
